name: App Store screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: بناء نسخة الويب
        run: |
          [ -d web ] || flutter create --platforms=web --org sa.almubarky --project-name qitaat . > /dev/null
          rm -rf test
          flutter pub get
          flutter build web --release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: التصوير
        run: |
          cd tool/shots && npm init -y > /dev/null && npm i playwright@1.48.2 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          pip install pillow > /dev/null
          (cd ../../build/web && python3 -m http.server 8080 > /dev/null 2>&1 &)
          sleep 2
          node shots.mjs
          python3 frame.py
      - uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: tool/shots/out
