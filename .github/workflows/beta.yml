name: TestFlight external

on:
  workflow_dispatch:
    inputs:
      build:
        description: رقم البناء
        required: true

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyjwt cryptography requests > /dev/null
      - name: مجموعة خارجية ومراجعة بيتا
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: python3 tool/asc_beta.py "${{ inputs.build }}"
