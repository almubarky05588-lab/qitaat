name: qitaat
description: "قطعة سيارتك — سوق قطع الغيار (مشتري وتاجر/مورد)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة والتنقل
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # الواجهة
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1

  # الخادم (يُربط في مرحلة لاحقة)
  supabase_flutter: ^2.8.0

  # أدوات
  intl: any
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
