name: lucide_icons
description: طبقة توافق محلية — نفس أسماء الأيقونات المستخدمة في التطبيق، برسومات Phosphor (MIT) مدمجة كخطوط.
version: 2.0.1
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: PhRegular
      fonts:
        - asset: fonts/PhRegular.ttf
    - family: PhFill
      fonts:
        - asset: fonts/PhFill.ttf
    - family: PhBold
      fonts:
        - asset: fonts/PhBold.ttf
    - family: PhDuotone
      fonts:
        - asset: fonts/PhDuotone.ttf
