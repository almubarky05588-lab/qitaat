name: App Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: بناء نسخة الويب
        run: |
          [ -d web ] || flutter create --platforms=web --org sa.almubarky --project-name qitaat . > /dev/null
          rm -rf test
          flutter pub get
          flutter build web --release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: التصوير
        run: |
          cd tool/shots && npm init -y > /dev/null && npm i playwright@1.48.2 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          pip install pillow > /dev/null
          (cd ../../build/web && python3 -m http.server 8080 > /dev/null 2>&1 &)
          sleep 2
          node shots.mjs
          python3 frame.py
      - name: رفع الصور لفرع appstore-shots
        run: |
          d=$(mktemp -d); cp tool/shots/out/*.png "$d"/
          cd "$d" && git init -q && git checkout -q -b appstore-shots && git add . \
            && git -c user.name=qitaat-ci -c user.email=ci@qitaat.local commit -qm "screenshots run ${GITHUB_RUN_NUMBER}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" appstore-shots
