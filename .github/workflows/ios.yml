name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    name: بناء قطعة سيارتك ورفعه إلى TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: البناء والرفع
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: bash tool/ci_ios.sh
