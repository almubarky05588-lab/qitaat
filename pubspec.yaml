name: qitaat
description: "قطعة سيارتك — سوق قطع الغيار (مشتري وتاجر/مورد)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  lucide_icons:
    path: packages/lucide_icons
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.8.0
  intl: any
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# أيقونة التطبيق — تُولَّد من assets/icon/app_icon.png (يُنشأ من app_icon.svg وقت البناء)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
