publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  lucide_icons: ^0.257.0
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.8.0
  intl: any
